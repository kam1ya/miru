[package]
name = "miru"
version = "0.1.2"
edition = "2021"

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
sysinfo = "0.40.1"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "sync"] }
fuzzy-matcher = "0.3.7"
netstat2 = "0.11.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true